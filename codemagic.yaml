workflows:
  ios-simulator-build:
    name: Mika Web · iOS Simulator
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Static project validation
        script: python3 scripts/validate_project.py
      - name: Build without signing
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project MikaWeb.xcodeproj \
            -scheme MikaWeb \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/SimulatorBuild.xcresult \
            MIKA_BUILD_SHA="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
    artifacts:
      - build/xcodebuild.log
      - build/SimulatorBuild.xcresult
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  # DRAFT ONLY: no triggering rules; user requested no CI invocation this round.
  zhihu-type4-wkwebview-draft:
    name: DRAFT · Type42 in actual WKWebView
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build simulator app (unsigned, draft)
        script: |
          set -euo pipefail
          xcodebuild build -project MikaWeb.xcodeproj -scheme MikaWeb -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Type4 \
            MIKA_BUILD_SHA="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO > build-type4.log 2>&1
      - name: Boot isolated simulator and run self-test 42 without model
        script: |
          set -euo pipefail
          mkdir -p build/type4-evidence
          SIM=""
          CONTAINER=""
          collect_evidence() {
            set +e
            mkdir -p build/type4-evidence
            if test -n "$CONTAINER"; then
              test ! -f "$CONTAINER/Documents/type4-result.json" || cp "$CONTAINER/Documents/type4-result.json" build/type4-evidence/
              test ! -f "$CONTAINER/Documents/type4-restart-result.json" || cp "$CONTAINER/Documents/type4-restart-result.json" build/type4-evidence/
              test ! -d "$CONTAINER/Library/Application Support/MikaWeb/Trace" || cp -R "$CONTAINER/Library/Application Support/MikaWeb/Trace" build/type4-evidence/
              test ! -d "$CONTAINER/Library/Application Support/MikaWeb/Diagnostics" || cp -R "$CONTAINER/Library/Application Support/MikaWeb/Diagnostics" build/type4-evidence/
            fi
            set -e
          }
          cleanup() {
            status=$?
            collect_evidence
            test -z "$SIM" || xcrun simctl shutdown "$SIM" || true
            test -z "$SIM" || xcrun simctl delete "$SIM" || true
            exit "$status"
          }
          trap cleanup EXIT
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and "iOS" in r["name"]))')
          DEVICE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if "iPhone" in d["name"]))')
          SIM=$(xcrun simctl create Mika-Type4 "$DEVICE" "$RUNTIME")
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          APP=build/Type4/Build/Products/Debug-iphonesimulator/MikaWeb.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$SIM" "$APP"
          xcrun simctl launch "$SIM" "$BUNDLE" --mika-type4-selftest
          CONTAINER=$(xcrun simctl get_app_container "$SIM" "$BUNDLE" data)
          for attempt in $(seq 1 300); do
            test ! -f "$CONTAINER/Documents/type4-result.json" || break
            sleep 2
          done
          collect_evidence
          test -f build/type4-evidence/type4-result.json
          xcrun simctl terminate "$SIM" "$BUNDLE"
          xcrun simctl launch "$SIM" "$BUNDLE" --mika-type4-restart-check
          for attempt in $(seq 1 120); do
            test ! -f "$CONTAINER/Documents/type4-restart-result.json" || break
            sleep 1
          done
          collect_evidence
          python3 -c 'import json; r=json.load(open("build/type4-evidence/type4-result.json")); assert r["runtime"]=="WKWebView" and r["passed"], r'
          python3 -c 'import json; r=json.load(open("build/type4-evidence/type4-restart-result.json")); assert r["runtime"]=="WKWebView" and r["passed"], r'
    artifacts:
      - build-type4.log
      - build/type4-evidence/**

  gate-batch1-wk-selftest:
    name: Gate batch 1 · eight WK runtime cases
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Validate project and self-test assets
        script: |
          set -euo pipefail
          python3 scripts/validate_project.py
          python3 -m unittest discover -s scripts -p test_gate_batch1_results.py
          bash -n scripts/run_gate_batch1_wk_selftest.sh
      - name: Build gate self-test simulator app without signing
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build -project MikaWeb.xcodeproj -scheme MikaWeb -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/GateBatch1 \
            -resultBundlePath build/GateBatch1Build.xcresult \
            MIKA_BUILD_SHA="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/gate-batch1-build.log
      - name: Run eight controlled WK cases and collect both App processes
        script: SIMCTL_CHILD_MIKA_GATE_ENVIRONMENT='Codemagic iOS Simulator' bash scripts/run_gate_batch1_wk_selftest.sh
    artifacts:
      - build/gate-batch1-build.log
      - build/GateBatch1Build.xcresult
      - build/gate-batch1-evidence/**
