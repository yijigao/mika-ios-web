name: Release (TestFlight)

on:
  workflow_dispatch:

jobs:
  beta:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write ASC API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8_B64"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "${{ runner.temp }}/AuthKey_${ASC_KEY_ID}.p8"
      - name: Load certs repo deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - name: Git identity for match
        run: |
          git config --global user.name "Mika Web CI"
          git config --global user.email "ci@mikaweb.local"
      - name: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta
      - name: Collect dSYMs
        if: always()
        run: |
          mkdir -p dsym-out
          # gym 把 xcarchive 放在 ~/Library/Developer/Xcode/Archives 下（不在
          # 工作区内），并把压缩好的 dSYM zip 放在工作区根目录——两处都收：
          # 原始 .dSYM 目录（可直接 atos）＋ gym 的压缩包各一份。
          find "$HOME/Library/Developer/Xcode/Archives" -name "*.dSYM" -type d -exec cp -R {} dsym-out/ \; 2>/dev/null || true
          find . -name "*.app.dSYM.zip" -exec cp {} dsym-out/ \; || true
          ls -la dsym-out || true
      - name: Upload dSYM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsym-${{ github.run_id }}
          path: dsym-out
          if-no-files-found: warn
          retention-days: 90
