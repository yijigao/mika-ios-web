name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MikaWeb.xcodeproj \
            -scheme MikaWeb \
            -destination 'generic/platform=iOS Simulator' \
            MIKA_BUILD_SHA="$(git rev-parse HEAD)" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
