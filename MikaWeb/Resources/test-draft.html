<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mika 真 Draft.js 编辑器页</title>
<style>body{font:20px system-ui;margin:24px}button{display:block;margin:16px 0;font:inherit;padding:10px 22px}.public-DraftEditor-content{min-height:120px}</style>
<h1>真 Draft.js 编辑器（框架状态驱动）</h1>
<p>本页内嵌真正的 Draft.js（0.11.7）＋React：正文、字数与保存状态全部由编辑器内部状态（EditorState）驱动，与知乎专栏同类。初始正文 102 字（模拟待改的已发布文章）。只有真正进入 EditorState 的写入才会让字数变化并触发保存落定；直接改 DOM 的文字不计入字数。点「更新」的判据：字数大于 0 且保存状态已落定。</p>
<div id="root"></div>
<p>字数：<span id="count">0</span></p>
<p>保存状态：<span id="savestate">草稿已保存</span></p>
<button id="update" type="button">更新</button>
<p id="result" role="status"></p>
<script>
document.getElementById('update').addEventListener('click',function(){
  var result=document.getElementById('result');
  var n=window.__stateCount||0;
  var save=document.getElementById('savestate').textContent;
  if(save.indexOf('保存中')>=0){result.textContent='更新失败：草稿保存中，未落定';return;}
  if(n<=0){result.textContent='更新失败：字数为 0，编辑器内部没有正文';return;}
  result.textContent='更新成功：正文共 '+n+' 字，保存已落定';
});
</script>
